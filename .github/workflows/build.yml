name: Build Explosive Cow Dung

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # ================= 新增：自动解压逻辑 =================
      - name: 解压 MDK 压缩包
        run: |
          # 寻找根目录下的 zip 文件并解压
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "未找到 zip 文件，假设文件已经解压好"
            exit 0
          fi
          echo "找到压缩包: $ZIP_FILE"
          unzip -q "$ZIP_FILE"
          
          # 检查解压后是否产生了一个单独的文件夹（MDK通常会有）
          DIR_NAME=$(find . -maxdepth 1 -type d ! -name "." ! -name ".github" | head -n 1)
          if [ -n "$DIR_NAME" ]; then
            echo "将 $DIR_NAME 内的文件移至根目录..."
            mv "$DIR_NAME"/* .
            mv "$DIR_NAME"/.[!.]* . 2>/dev/null || true  # 移动隐藏文件（如 .gitignore）
            rmdir "$DIR_NAME"
          fi
          rm "$ZIP_FILE"
      # ======================================================

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 配置 Gradle（自带缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 给 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建
        run: ./gradlew build --no-daemon

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Explosive-Cow-Dung
          path: build/libs/*.jar
          if-no-files-found: error

      # 推送形如 v1.0.0 的 tag 时，自动创建 Release 并附上 jar
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
