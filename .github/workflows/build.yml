name: Build Explosive Cow Dung

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 核心修复：如果发现缺失 gradlew，直接从网上下载完整的官方骨架
      - name: 修复并补全官方构建环境
        run: |
          echo "检查 gradlew 是否存在..."
          if [ ! -f "gradlew" ]; then
            echo "未找到 gradlew，开始下载官方 1.21.1 MDK 骨架..."
            # 下载官方 MDK 压缩包
            curl -L -o mdk.zip "https://maven.minecraftforge.net/net/minecraftforge/forge/1.21.1-52.1.20/forge-1.21.1-52.1.20-mdk.zip"
            # 解压到临时文件夹
            unzip -q mdk.zip -d temp_mdk
            # 将官方的 gradlew、build.gradle、settings.gradle 和 gradle 文件夹复制到当前目录
            cp -r temp_mdk/* . 
            # 清理垃圾
            rm -rf temp_mdk mdk.zip
          fi
          # 给 gradlew 赋予执行权限
          chmod +x gradlew

      - name: 配置 Gradle（自带缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 构建
        run: ./gradlew build --no-daemon

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Explosive-Cow-Dung
          path: build/libs/*.jar
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
